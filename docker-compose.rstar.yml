services:
  redis:
    image: redis:7-alpine
    container_name: rstar-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  code-judge:
    build:
      context: ./code-judge
    container_name: rstar-code-judge
    restart: unless-stopped
    environment:
      - REDIS_URI=${REDIS_URI}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME}
      - RUN_WORKERS=0
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port ${CODE_JUDGE_PORT} --workers 16
    ports:
      - "${CODE_JUDGE_PORT}:${CODE_JUDGE_PORT}"
    depends_on:
      - redis

  code-judge-worker:
    build:
      context: ./code-judge
    container_name: rstar-code-judge-worker
    restart: unless-stopped
    environment:
      - REDIS_URI=${REDIS_URI}
      - MAX_EXECUTION_TIME=${MAX_EXECUTION_TIME}
      - MAX_WORKERS=${MAX_WORKERS}
    command: >-
      python run_workers.py
    depends_on:
      - redis

  vllm:
    image: vllm/vllm-openai:latest
    container_name: rstar-vllm
    restart: unless-stopped
    environment:
      - HF_HUB_DISABLE_TELEMETRY=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command: >-
      --model ${MODEL_PATH}
      --host ${VLLM_HOST}
      --port ${VLLM_PORT}
      --max-model-len 8192
      --gpu-memory-utilization 0.9
      --enable-auto-tool-choice
      --tool-call-parser hermes
    ports:
      - "${VLLM_PORT}:${VLLM_PORT}"
    volumes:
      - ${MODEL_PATH}:${MODEL_PATH}:ro
    gpus: all

networks:
  default:
    name: rstar-net
